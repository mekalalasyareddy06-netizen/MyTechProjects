# Placeholder values — replace before applying to a real cluster, or better,
# generate this with `kubectl create secret generic ... --from-literal=...`
# so the actual secret values never live in version control.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: cloud-native-platform
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me-root-password
  MYSQL_DATABASE: cloud_native_platform
  MYSQL_USER: platform_user
  MYSQL_PASSWORD: change-me-app-password
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: cloud-native-platform
type: Opaque
stringData:
  JWT_SECRET: change-me-to-a-long-random-string
  S3_ACCESS_KEY: your-aws-access-key-id
  S3_SECRET_KEY: your-aws-secret-access-key
