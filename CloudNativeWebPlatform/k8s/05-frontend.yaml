apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloud-native-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replace with your pushed image, e.g. your-dockerhub-user/cnp-frontend:latest
          image: your-registry/cloud-native-platform-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloud-native-platform
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
